name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: node dist/cli.js --help
      - name: Package tested library and CLI
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
      - name: Save tested package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: texas-baseball-intelligence-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7
